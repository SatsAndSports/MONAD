[package]
name = "monad-server"
version = "0.1.0"
edition = "2021"

[dependencies]
monad-common = { path = "../monad-common" }
monad-quic = { path = "../monad-quic" }
h2 = "0.4"
quinn = "0.11"
tokio = { version = "1", features = ["full"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1"
anyhow = "1"
serde_json = "1"

[dev-dependencies]
monad-client = { path = "../monad-client" }
monad-quic = { path = "../monad-quic" }
quinn = "0.11"
