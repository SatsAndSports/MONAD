[package]
name = "monad-client"
version = "0.1.0"
edition = "2021"

[features]
# Fault-injection builds only. Never enable for a wallet holding real funds.
funds-lifecycle-test = []

[dependencies]
monad-common = { path = "../monad-common" }
monad-quic = { path = "../monad-quic" }
quinn = "0.11"
h2 = "0.4"
tokio = { version = "1", features = ["full"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1"
anyhow = "1"
serde_json = "1"
rand = "0.9"
rusqlite = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
cashu = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.18.1", package = "cashu", default-features = false }
cdk-spilman = { git = "https://github.com/SatsAndSports/cashu_spilman_channels.git", rev = "a0d50ad270b956c33169c6051cb99c2b1fe30748", package = "cdk-spilman", features = ["wallet", "configurable-host-reqwest", "client-sqlite"] }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3"
cdk-spilman-test-mint = { git = "https://github.com/SatsAndSports/cashu_spilman_channels.git", rev = "a0d50ad270b956c33169c6051cb99c2b1fe30748", package = "cdk-spilman-test-mint", default-features = false, features = ["http"] }
