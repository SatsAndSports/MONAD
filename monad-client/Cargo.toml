[package]
name = "monad-client"
version = "0.1.0"
edition = "2021"

[dependencies]
monad-common = { path = "../monad-common" }
monad-quic = { path = "../monad-quic" }
quinn = "0.11"
h2 = "0.4"
tokio = { version = "1", features = ["full"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1"
anyhow = "1"
serde_json = "1"
rand = "0.9"
rusqlite = "0.31"
cdk-spilman = { path = "../../../Cashu/Channels/spilman_channel/cashu_spilman_channels/crates/cdk-spilman", features = ["wallet", "configurable-host-reqwest", "client-sqlite"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
cdk-spilman-test-mint = { path = "../../../Cashu/Channels/spilman_channel/cashu_spilman_channels/crates/cdk-spilman-test-mint", default-features = false, features = ["http"] }
