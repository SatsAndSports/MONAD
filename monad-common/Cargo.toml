[package]
name = "monad-common"
version = "0.2.0"
edition = "2021"

[features]
# Isolated process fixtures only; not a negotiated production protocol.
funds-lifecycle-test = []

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
hex = "0.4"
anyhow = "1"
dotenvy = "0.15"
thiserror = "2"
tracing = "0.1"
h2 = "0.4"
http = "1"
ring = "0.17"
sha2 = "0.10"
bech32 = "0.11"
base64 = "0.22"
ciborium = "0.2"
k256 = { version = "0.13", features = ["arithmetic", "ecdh", "schnorr"] }
rand_core = "0.6"
noise-protocol = "0.2"
noise-rust-crypto = { version = "0.6", features = ["use-blake2", "use-chacha20poly1305"] }
cdk-spilman.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
