[package]
name = "monad-common"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
h2 = "0.4"
http = "1"
ring = "0.17"
sha2 = "0.10"
bech32 = "0.11"
k256 = { version = "0.13", features = ["arithmetic", "ecdh", "schnorr"] }
rand_core = "0.6"
noise-protocol = "0.2"
noise-rust-crypto = { version = "0.6", features = ["use-blake2", "use-chacha20poly1305"] }
