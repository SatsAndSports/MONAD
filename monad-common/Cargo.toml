[package]
name = "monad-common"
version = "0.1.0"
edition = "2021"

[dependencies]
snow = "0.9"
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "1"
tracing = "0.1"
h2 = "0.4"
http = "1"
ring = "0.17"
sha2 = "0.10"
curve25519-dalek = "4"
