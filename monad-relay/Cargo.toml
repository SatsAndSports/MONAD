[package]
name = "monad-relay"
version = "0.1.0"
edition = "2021"

[dependencies]
monad-common = { path = "../monad-common" }
monad-quic = { path = "../monad-quic" }
h2 = "0.4"
quinn = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dotenvy = "0.15"
rusqlite = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
cdk-spilman = { git = "https://github.com/SatsAndSports/cashu_spilman_channels.git", rev = "10bf2d4d5994a94574102d3c144d06e481dbf97e", package = "cdk-spilman", features = ["wallet", "configurable-host-reqwest"] }
cashu = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.17.6", package = "cashu", default-features = false }

[dev-dependencies]
monad-client = { path = "../monad-client" }
monad-quic = { path = "../monad-quic" }
quinn = "0.11"
cdk-spilman-test-mint = { git = "https://github.com/SatsAndSports/cashu_spilman_channels.git", rev = "10bf2d4d5994a94574102d3c144d06e481dbf97e", package = "cdk-spilman-test-mint", default-features = false, features = ["http"] }
cdk = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.17.6", package = "cdk", default-features = false, features = ["mint"] }
axum = "0.8.9"
tempfile = "3"
socket2 = "0.6"
