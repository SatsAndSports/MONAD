[package]
name = "monad-test-mint"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
monad-common = { path = "../monad-common" }
monad-management = { path = "../monad-management" }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.31"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cdk = { workspace = true, features = ["mint"] }
cdk-common.workspace = true
cdk-axum.workspace = true
cdk-fake-wallet.workspace = true
cdk-sqlite = { workspace = true, features = ["mint"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
monad-client = { path = "../monad-client" }
monad-relay = { path = "../monad-relay" }
cdk-spilman = { workspace = true, features = ["wallet", "configurable-host-reqwest", "client-sqlite"] }
