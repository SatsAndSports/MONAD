[package]
name = "monad-management"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures-util = "0.3"
rand = "0.9"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

[dev-dependencies]
tempfile = "3"
